<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
<title>Wexon Growth OS — Bağlantı yok</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #05090b; color: #f4f7f8; font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background-image: radial-gradient(45% 40% at 25% 20%, rgba(11,79,74,.85), transparent 70%), radial-gradient(40% 36% at 80% 85%, rgba(7,90,150,.55), transparent 70%); }
  .kart { width: min(440px, calc(100% - 32px)); box-sizing: border-box; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 26px; padding: 36px 34px; text-align: center; backdrop-filter: blur(14px); box-shadow: 0 30px 60px -30px rgba(0,0,0,.7); }
  .logo { width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 18px; background: #0b4f4a; color: #3dff9a; display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; }
  p { margin: 0 0 22px; color: rgba(232,240,242,.62); }
  small { display: block; margin-top: 16px; color: rgba(232,240,242,.38); font-size: 12px; word-break: break-all; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; min-height: 46px; padding: 0 24px; background: linear-gradient(95deg, #3dff9a, #5fd4ff); color: #04110f; cursor: pointer; }
  button:hover { filter: brightness(1.05); }
  button:focus-visible { outline: 3px solid rgba(61,255,154,.5); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="kart">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01"/></svg></div>
    <h1>Growth OS’a ulaşılamadı</h1>
    <p>İnternet bağlantınızı kontrol edin. Bağlantı gelince otomatik olarak yeniden denenecek.</p>
    <button id="tekrar" type="button">Tekrar dene</button>
    <small id="ayrinti"></small>
  </div>
  <script src="hata.js"></script>
</body>
</html>
