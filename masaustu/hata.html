<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
<title>Wexon Growth OS — Bağlantı yok</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #f5f7f9; color: #111827; font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .kart { background: #fff; border: 1px solid #e8ecef; border-radius: 22px; padding: 34px 38px; max-width: 460px; text-align: center; box-shadow: 0 10px 30px rgba(17, 24, 39, .06); }
  .logo { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 16px; background: #0b4f4a; color: #3dff9a; display: grid; place-items: center; font-weight: 800; font-size: 26px; }
  h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.02em; }
  p { margin: 0 0 18px; color: #6b7280; }
  small { display: block; margin-top: 14px; color: #9ca3af; font-size: 12px; word-break: break-all; }
  button { font: inherit; font-weight: 650; border: 0; border-radius: 14px; min-height: 44px; padding: 0 22px; background: #3dff9a; color: #0b4f4a; cursor: pointer; }
</style>
</head>
<body>
  <div class="kart">
    <div class="logo">W</div>
    <h1>Growth OS'a ulaşılamadı</h1>
    <p>İnternet bağlantını kontrol et. Bağlantı gelince otomatik tekrar denenecek.</p>
    <button id="tekrar" type="button">Tekrar dene</button>
    <small id="ayrinti"></small>
  </div>
  <script src="hata.js"></script>
</body>
</html>
