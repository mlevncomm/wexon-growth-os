<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
<title>Wexon Growth OS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background: #05090b; color: #f4f7f8;
    font: 15px/1.5 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  .isik {
    position: fixed; inset: -25%;
    background:
      radial-gradient(40% 36% at 30% 28%, rgba(11, 79, 74, .9), transparent 70%),
      radial-gradient(30% 28% at 55% 48%, rgba(61, 255, 154, .14), transparent 70%),
      radial-gradient(40% 36% at 78% 80%, rgba(7, 90, 150, .7), transparent 70%);
    animation: kay 9s ease-in-out infinite alternate;
  }
  .izgara {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(60% 55% at 50% 50%, #000 15%, transparent 75%);
  }
  .orta { position: relative; display: grid; justify-items: center; gap: 22px; animation: gir .7s cubic-bezier(.2,.8,.2,1) both; }
  .isaret { position: relative; width: 84px; height: 84px; }
  .isaret svg { width: 84px; height: 84px; display: block; filter: drop-shadow(0 20px 40px rgba(61, 255, 154, .25)); }
  .cizgi { stroke-dasharray: 44; stroke-dashoffset: 44; animation: ciz 1.1s .25s cubic-bezier(.6,0,.2,1) forwards; }
  .nokta { transform-origin: 36px 16.5px; transform: scale(0); animation: bel .4s 1.15s cubic-bezier(.3,1.6,.5,1) forwards; }
  .ad { font-size: 20px; letter-spacing: -.02em; color: rgba(232,240,242,.7); }
  .ad b { color: #fff; font-weight: 700; }
  .cubuk { width: 160px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .cubuk i { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #3dff9a, #5fd4ff); animation: akis 1.3s ease-in-out infinite; }
  .not { font-size: 12.5px; letter-spacing: .04em; color: rgba(232,240,242,.4); }
  @keyframes kay { from { transform: translate3d(-2%,-1%,0) scale(1); } to { transform: translate3d(2%,2%,0) scale(1.08); } }
  @keyframes gir { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes ciz { to { stroke-dashoffset: 0; } }
  @keyframes bel { to { transform: scale(1); } }
  @keyframes akis { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .isik, .orta, .cubuk i { animation: none; } .cizgi { stroke-dashoffset: 0; animation: none; } .nokta { transform: none; animation: none; } }
</style>
</head>
<body>
  <div class="isik"></div>
  <div class="izgara"></div>
  <div class="orta" role="status" aria-label="Wexon Growth OS açılıyor">
    <div class="isaret">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#0b4f4a" />
        <rect x=".5" y=".5" width="47" height="47" rx="13.5" stroke="#3dff9a" stroke-opacity=".25" />
        <path class="cizgi" d="M12 32.5l7.2-8.4 6 5.2L36 16.5" stroke="#3dff9a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
        <circle class="nokta" cx="36" cy="16.5" r="3.6" fill="#3dff9a" />
      </svg>
    </div>
    <div class="ad">Wexon <b>Growth OS</b></div>
    <div class="cubuk"><i></i></div>
    <div class="not">Güvenli bağlantı kuruluyor</div>
  </div>
</body>
</html>
